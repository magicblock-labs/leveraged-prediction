:root {
  --bg: #fafaf8;
  --card: #ffffff;
  --ink: #17181c;
  --mut: #6e7076;
  --hair: #e8e7e3;
  --up: #00a862;
  --down: #e5484d;
  --up-tint: rgba(0, 168, 98, 0.09);
  --down-tint: rgba(229, 72, 77, 0.09);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131417; --card: #1a1b1f; --ink: #f0efec; --mut: #9b9c9f; --hair: #26272b;
    --up: #2bd186; --down: #ff6b6e;
    --up-tint: rgba(43, 209, 134, 0.1); --down-tint: rgba(255, 107, 110, 0.1);
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --card: #1a1b1f; --ink: #f0efec; --mut: #9b9c9f; --hair: #26272b;
  --up: #2bd186; --down: #ff6b6e;
  --up-tint: rgba(43, 209, 134, 0.1); --down-tint: rgba(255, 107, 110, 0.1);
}
:root[data-theme="light"] {
  --bg: #fafaf8; --card: #ffffff; --ink: #17181c; --mut: #6e7076; --hair: #e8e7e3;
  --up: #00a862; --down: #e5484d;
  --up-tint: rgba(0, 168, 98, 0.09); --down-tint: rgba(229, 72, 77, 0.09);
}

* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Figtree, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ── navbar ─────────────────────────────── */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; background: var(--bg); border-bottom: 1px solid var(--hair);
}
.mark { font-weight: 800; font-size: 21px; letter-spacing: -0.4px; }
.bar-right { display: flex; align-items: center; gap: 16px; }
.power { text-align: right; line-height: 1.2; }
.power span { display: block; font-size: 11px; color: var(--mut); }
.power strong { font-size: 14px; font-weight: 700; }
.wallet {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600;
  border: 1px solid var(--hair); border-radius: 999px; padding: 7px 13px; background: var(--card);
}
.wallet .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }

/* ── main column ────────────────────────── */
.col { max-width: 680px; margin: 0 auto; padding: 28px 20px 60px; display: flex; flex-direction: column; gap: 24px; }

.quote .eyebrow { font-size: 13px; font-weight: 600; color: var(--mut); }
.quote h1 { font-size: 44px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; margin-top: 2px; }
.quote .chg { font-size: 14px; font-weight: 600; }

.chartwrap { height: 260px; position: relative; }
.chartwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ── ticket ─────────────────────────────── */
.ticket { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 20px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button {
  padding: 12px; border-radius: 10px; border: 1px solid var(--hair);
  font-weight: 700; font-size: 15px; color: var(--mut); background: var(--bg);
}
.seg button[aria-pressed="true"].up { background: var(--up-tint); border-color: var(--up); color: var(--up); }
.seg button[aria-pressed="true"].down { background: var(--down-tint); border-color: var(--down); color: var(--down); }

.field { margin-top: 18px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--mut); margin-bottom: 6px; }
.stake-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.amount {
  display: flex; align-items: center; gap: 2px; flex: 1; min-width: 130px;
  border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; background: var(--bg);
}
.amount span { color: var(--mut); font-weight: 600; }
.amount input {
  width: 100%; border: 0; background: none; font-size: 17px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.amount input:focus { outline: none; }
.amount:focus-within { border-color: var(--ink); }
.preset {
  border: 1px solid var(--hair); border-radius: 999px; padding: 8px 14px;
  font-size: 13px; font-weight: 600; color: var(--mut); background: var(--card);
}
.preset[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.meta { margin-top: 14px; font-size: 12.5px; color: var(--mut); }
.meta b { color: var(--ink); font-weight: 600; }

.cta {
  margin-top: 16px; width: 100%; padding: 15px; border-radius: 12px;
  font-size: 16px; font-weight: 700; color: #fff;
  transition: filter 0.12s ease;
}
.cta.up { background: var(--up); }
.cta.down { background: var(--down); }
.cta:hover:not(:disabled) { filter: brightness(1.06); }
.warn { margin-top: 10px; font-size: 12.5px; font-weight: 600; color: var(--down); }

.notice {
  border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
  font-size: 13.5px; font-weight: 600;
}
.notice.bust { background: var(--down-tint); color: var(--down); }
.notice.win { background: var(--up-tint); color: var(--up); }

/* ── positions ──────────────────────────── */
.positions h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--mut); margin-bottom: 4px; }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 2px; border-bottom: 1px solid var(--hair);
}
.row .chip {
  width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
  display: grid; place-items: center; font-size: 15px; font-weight: 700;
}
.row .chip.up { background: var(--up-tint); color: var(--up); }
.row .chip.down { background: var(--down-tint); color: var(--down); }
.row .what { flex: 1; min-width: 0; }
.row .what strong { display: block; font-size: 14.5px; font-weight: 700; }
.row .what span { font-size: 12.5px; color: var(--mut); }
.row .res { text-align: right; }
.row .res strong { display: block; font-size: 14.5px; font-weight: 700; }
.row .res span { font-size: 12px; color: var(--mut); }
.tbar {
  display: block; margin-top: 7px; height: 3px; width: 100%; max-width: 220px;
  border-radius: 2px; background: var(--hair); overflow: hidden;
}
.tbar i { display: block; height: 100%; border-radius: 2px; background: var(--ink); }
.empty { padding: 22px 2px; font-size: 14px; color: var(--mut); }

.pos-up { color: var(--up); }
.pos-down { color: var(--down); }

@media (max-width: 560px) {
  .quote h1 { font-size: 36px; }
  .power { display: none; }
}

/* ── desktop: full-height chart, right order rail ── */
.stage, .rail { display: contents; }
@media (min-width: 1000px) {
  .col {
    max-width: none; height: calc(100dvh - 62px);
    padding: 24px 32px; gap: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) 400px; column-gap: 36px;
  }
  .stage { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .chartwrap { flex: 1; height: auto; min-height: 0; }
  .rail { display: flex; flex-direction: column; gap: 24px; min-height: 0; overflow-y: auto; }
  .ticket { flex: 0 0 auto; }
  .amount { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .cta { transition: none; }
}
</style>

<header class="bar">
  <div class="mark">lever</div>
  <div class="bar-right">
    <div class="power"><span>Buying power</span><strong class="num" id="bal">$500.00</strong></div>
    <button class="wallet" type="button" title="Mock wallet — visual prototype"><i class="dot"></i>7xKp…9fQ4</button>
  </div>
</header>

<main class="col">
  <div class="stage">
  <section class="quote">
    <span class="eyebrow">Solana · SOL-USD</span>
    <h1 class="num" id="px">—</h1>
    <span class="chg num" id="chg"></span>
  </section>

  <div class="chartwrap"><canvas id="cv"></canvas></div>
  </div>

  <aside class="rail">
  <section class="ticket">
    <div id="noticeHost" aria-live="polite"></div>
    <div class="seg" role="group" aria-label="Direction">
      <button class="up" id="segUp" type="button" aria-pressed="true">▲ Up</button>
      <button class="down" id="segDown" type="button" aria-pressed="false">▼ Down</button>
    </div>
    <div class="field">
      <label for="stakeInput">Stake</label>
      <div class="stake-row">
        <div class="amount"><span>$</span><input id="stakeInput" inputmode="decimal" value="25" aria-label="Stake in dollars"></div>
        <button class="preset num" type="button" data-v="10">$10</button>
        <button class="preset num" type="button" data-v="25" aria-pressed="true">$25</button>
        <button class="preset num" type="button" data-v="50">$50</button>
        <button class="preset num" type="button" data-v="100">$100</button>
      </div>
    </div>
    <p class="meta num" id="meta"></p>
    <button class="cta up" id="btnOpen" type="button"></button>
    <p class="warn" id="warn" hidden></p>
  </section>

  <section class="positions">
    <h2>Positions</h2>
    <div id="rows"><p class="empty">No positions yet — choose Up or Down above.</p></div>
  </section>
  </aside>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const LEV = 1000, TICK = 300, SPAN = 90000, GUTTER = 64, LIFE = 10000;
const fmt$ = (v) => `${v < 0 ? "−" : ""}$${Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const fmtPx = (v) => `$${v.toFixed(3)}`;
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5);
const timeStr = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

let price = 195 + Math.random() * 2;
let momentum = 0;
const sessionOpen = price;
let points = [{ t: performance.now(), p: price }];
let balance = 500;
let dir = 1;
let live = []; // { id, dir, stake, entry, t0, ends, at, el }
let nextId = 1;
let history = [];
let dispP = price;
let vLo = price - 0.1, vHi = price + 0.1;

const pnlPct = (p, curP) => Math.max(-100, p.dir * (curP / p.entry - 1) * LEV * 100);

function tick() {
  momentum = momentum * 0.94 + gauss() * 2.6e-5;
  price *= 1 + momentum + gauss() * 8e-5;
  const now = performance.now();
  points.push({ t: now, p: price });
  while (points.length > 2 && points[0].t < now - SPAN - 2000) points.shift();
  for (const p of [...live]) if (now >= p.ends) settle(p);
}
setInterval(tick, TICK);

/* ── ticket logic ───────────────────────── */
function stakeVal() { return parseFloat($("stakeInput").value) || 0; }

function renderIdle() {
  const s = stakeVal();
  $("btnOpen").className = `cta ${dir > 0 ? "up" : "down"}`;
  $("btnOpen").textContent = `Open ${dir > 0 ? "Up" : "Down"} position · ${fmt$(s)}`;
  $("meta").innerHTML = `<b>1000× leverage</b> — ${fmt$(s)} controls a ${fmt$(s * LEV)} position. It settles at whatever the price is in <b>10 seconds</b>; you can never lose more than your stake.`;
  const bad = s <= 0 || s > balance;
  $("btnOpen").disabled = bad;
  $("warn").hidden = !(s > balance);
  $("warn").textContent = s > balance ? `Stake is above your ${fmt$(balance)} buying power — lower it to trade.` : "";
}

function setDir(d) {
  dir = d;
  $("segUp").setAttribute("aria-pressed", String(d > 0));
  $("segDown").setAttribute("aria-pressed", String(d < 0));
  renderIdle();
}
$("segUp").onclick = () => setDir(1);
$("segDown").onclick = () => setDir(-1);
$("stakeInput").oninput = () => {
  document.querySelectorAll(".preset").forEach((b) => b.setAttribute("aria-pressed", String(parseFloat(b.dataset.v) === stakeVal())));
  renderIdle();
};
document.querySelectorAll(".preset").forEach((b) => {
  b.onclick = () => { $("stakeInput").value = b.dataset.v; $("stakeInput").oninput(); };
});

$("btnOpen").onclick = () => {
  const stake = stakeVal();
  if (stake <= 0 || stake > balance) return;
  balance -= stake;
  const now = performance.now();
  live.push({ id: nextId++, dir, stake, entry: price, t0: now, ends: now + LIFE, at: new Date() });
  $("noticeHost").replaceChildren();
  renderBalance();
  renderIdle();
  renderRows();
};

function settle(p) {
  const pnl = p.stake * pnlPct(p, price) / 100;
  balance += p.stake + pnl;
  live = live.filter((q) => q !== p);
  history.unshift({ dir: p.dir, stake: p.stake, entry: p.entry, exit: price, pnl, at: new Date() });
  const n = document.createElement("p");
  n.className = `notice ${pnl < 0 ? "bust" : "win"}`;
  n.textContent = `Position settled at ${fmtPx(price)}. ${pnl >= 0 ? "You made " + fmt$(pnl) : "You lost " + fmt$(-pnl)} on a ${fmt$(p.stake)} stake.`;
  $("noticeHost").replaceChildren(n);
  renderBalance();
  renderIdle();
  renderRows();
}

function renderBalance() { $("bal").textContent = fmt$(balance); }

function renderRows() {
  const host = $("rows");
  host.replaceChildren();
  if (live.length === 0 && history.length === 0) {
    host.innerHTML = `<p class="empty">No positions yet — choose Up or Down above.</p>`;
    return;
  }
  for (const p of live) {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML =
      `<div class="chip ${p.dir > 0 ? "up" : "down"}">${p.dir > 0 ? "▲" : "▼"}</div>` +
      `<div class="what"><strong>${p.dir > 0 ? "Up" : "Down"} · ${fmt$(p.stake)} stake</strong>` +
      `<span class="num">Entry ${fmtPx(p.entry)} · settles in <b class="tleft"></b></span>` +
      `<span class="tbar"><i></i></span></div>` +
      `<div class="res num"><strong class="rpnl"></strong><span>live</span></div>`;
    p.el = r;
    host.append(r);
  }
  for (const hRow of history) {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML =
      `<div class="chip ${hRow.dir > 0 ? "up" : "down"}">${hRow.dir > 0 ? "▲" : "▼"}</div>` +
      `<div class="what"><strong>${hRow.dir > 0 ? "Up" : "Down"} · ${fmt$(hRow.stake)} stake</strong>` +
      `<span class="num">${fmtPx(hRow.entry)} → ${fmtPx(hRow.exit)}</span></div>` +
      `<div class="res num"><strong class="${hRow.pnl >= 0 ? "pos-up" : "pos-down"}">${hRow.pnl >= 0 ? "+" : ""}${fmt$(hRow.pnl)}</strong><span>${timeStr(hRow.at)}</span></div>`;
    host.append(r);
  }
}

/* ── chart ──────────────────────────────── */
const cv = $("cv"), ctx = cv.getContext("2d");
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw() {
  requestAnimationFrame(draw);
  const dpr = devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const now = performance.now();
  const wLine = w - GUTTER;
  dispP += (price - dispP) * 0.18;

  let lo = Infinity, hi = -Infinity;
  for (const pt of points) { if (pt.t >= now - SPAN) { if (pt.p < lo) lo = pt.p; if (pt.p > hi) hi = pt.p; } }
  lo = Math.min(lo, sessionOpen); hi = Math.max(hi, sessionOpen);
  for (const p of live) { lo = Math.min(lo, p.entry); hi = Math.max(hi, p.entry); }
  const pad = Math.max((hi - lo) * 0.18, price * 3e-4);
  vLo += (lo - pad - vLo) * 0.1;
  vHi += (hi + pad - vHi) * 0.1;
  const Y = (p) => h - ((p - vLo) / (vHi - vLo)) * h;
  const X = (t) => wLine - (now - t) * (wLine / SPAN);

  const vis = points.filter((pt) => pt.t >= now - SPAN - 1200);
  if (vis.length < 2) return;
  const lineCol = dispP >= sessionOpen ? css("--up") : css("--down");

  const pathTo = (pts) => {
    ctx.moveTo(X(pts[0].t), Y(pts[0].p));
    for (let i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i].t), Y(pts[i].p));
    ctx.lineTo(wLine, Y(dispP));
  };

  // session-open baseline
  const refY = Y(sessionOpen);
  ctx.setLineDash([2, 5]);
  ctx.strokeStyle = css("--mut");
  ctx.globalAlpha = 0.7;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, refY); ctx.lineTo(wLine, refY); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);
  ctx.font = "600 11px Figtree";
  ctx.textBaseline = "middle";
  ctx.fillStyle = css("--mut");
  ctx.fillText("open", wLine + 8, refY - 8);
  ctx.fillText(sessionOpen.toFixed(2), wLine + 8, refY + 6);

  // soft gradient under the line
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, lineCol);
  grad.addColorStop(1, lineCol + "00");
  ctx.save();
  ctx.beginPath(); pathTo(vis);
  ctx.lineTo(wLine, h); ctx.lineTo(X(vis[0].t), h); ctx.closePath();
  ctx.globalAlpha = 0.08; ctx.fillStyle = grad; ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  // entry line + live label per open position
  for (const p of live) {
    const ey = Y(p.entry);
    const pct = pnlPct(p, dispP);
    const pnl = p.stake * pct / 100;
    const col = pnl >= 0 ? css("--up") : css("--down");
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ey); ctx.lineTo(wLine, ey); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);

    const left = Math.max(0, (p.ends - now) / 1000);
    const text = `${p.dir > 0 ? "▲" : "▼"} ${pnl >= 0 ? "+" : ""}${fmt$(pnl)} · ${left.toFixed(0)}s`;
    ctx.font = "700 11px Figtree";
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(8, ey - 10, tw + 14, 20, 10); ctx.fill();
    ctx.fillStyle = css("--bg");
    ctx.fillText(text, 15, ey + 1);
  }

  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.strokeStyle = lineCol;
  ctx.beginPath(); pathTo(vis); ctx.stroke();

  const ly = Y(dispP);
  ctx.fillStyle = lineCol;
  ctx.beginPath(); ctx.arc(wLine, ly, 3.5, 0, 7); ctx.fill();
  ctx.font = "700 11px Figtree";
  const tagText = dispP.toFixed(3);
  const tw = ctx.measureText(tagText).width;
  ctx.beginPath(); ctx.roundRect(wLine + 4, ly - 10, tw + 12, 20, 6); ctx.fill();
  ctx.fillStyle = css("--bg");
  ctx.fillText(tagText, wLine + 10, ly + 1);

  updateHud(now);
}

function updateHud(now) {
  $("px").textContent = fmtPx(dispP);
  const chg = dispP - sessionOpen;
  const el = $("chg");
  el.textContent = `${chg >= 0 ? "▲" : "▼"} ${fmt$(Math.abs(chg))} (${Math.abs(chg / sessionOpen * 100).toFixed(3)}%) this session`;
  el.className = `chg num ${chg >= 0 ? "pos-up" : "pos-down"}`;
  for (const p of live) {
    if (!p.el) continue;
    const pct = pnlPct(p, dispP);
    const pnl = p.stake * pct / 100;
    const rpnl = p.el.querySelector(".rpnl");
    rpnl.textContent = `${pnl >= 0 ? "+" : ""}${fmt$(pnl)}`;
    rpnl.className = `rpnl ${pnl >= 0 ? "pos-up" : "pos-down"}`;
    p.el.querySelector(".tleft").textContent = `${Math.max(0, Math.ceil((p.ends - now) / 1000))}s`;
    p.el.querySelector(".tbar i").style.width = `${Math.max(0, (p.ends - now) / LIFE) * 100}%`;
  }
}

renderIdle();
renderBalance();
requestAnimationFrame(draw);
</script>
