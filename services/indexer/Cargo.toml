[workspace]
members = ["crates/api", "crates/decoder", "crates/indexer", "crates/storage"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["ws"] }
base64 = "0.22.1"
borsh = { version = "1.5.1", features = ["derive"] }
carbon-core = { version = "=0.12.0", default-features = false, features = ["macros"] }
carbon-rpc-program-subscribe-datasource = "=0.12.0"
carbon-rpc-transaction-crawler-datasource = "=0.12.0"
clap = { version = "4.5.53", features = ["derive", "env"] }
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
solana-account = "3.0.0"
solana-client = "3.0.0"
solana-commitment-config = "3.0.0"
solana-instruction = { version = "3.0.0", default-features = false }
solana-pubkey = { version = "3.0.0", features = ["borsh", "curve25519", "serde"] }
solana-signature = "3.0.0"
solana-transaction-status = "3.0.0"
sqlx = { version = "0.8.6", default-features = false, features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio-rustls",
] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.2", features = ["limit", "util"] }
tower-http = { version = "0.6.6", features = ["cors", "request-id", "trace"] }
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
